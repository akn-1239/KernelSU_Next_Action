name: Build Kernel

on:
  workflow_dispatch:
  watch:
    types: [started]

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v3

      - name: Setup Configuration
        run: |
          val() { grep -m1 "^$1=" config.env | cut -d= -f2-; }
          echo "KERNEL_SOURCE=$(val KERNEL_SOURCE)" >> $GITHUB_ENV
          echo "KERNEL_SOURCE_BRANCH=$(val KERNEL_SOURCE_BRANCH)" >> $GITHUB_ENV
          echo "KERNEL_CONFIG=$(val KERNEL_CONFIG)" >> $GITHUB_ENV
          echo "ARCH=$(val ARCH)" >> $GITHUB_ENV
          echo "KERNEL_FILE=$(val KERNEL_FILE)" >> $GITHUB_ENV
          echo "DISABLE_LTO=$(val DISABLE_LTO)" >> $GITHUB_ENV
          echo "ENABLE_KERNELSU=$(val ENABLE_KERNELSU)" >> $GITHUB_ENV
          echo "ENABLE_SUSFS=$(val ENABLE_SUSFS)" >> $GITHUB_ENV
          echo "ADD_KPROBES_CONFIG=$(val ADD_KPROBES_CONFIG)" >> $GITHUB_ENV
          echo "ADD_OVERLAYFS_CONFIG=$(val ADD_OVERLAYFS_CONFIG)" >> $GITHUB_ENV
          echo "DISABLE_CC_WERROR=$(val DISABLE_CC_WERROR)" >> $GITHUB_ENV
          echo "MAKE_BOOT_IMAGE=$(val MAKE_BOOT_IMAGE)" >> $GITHUB_ENV
          # 原厂 boot.img 直链（GitHub Web 上传单文件上限 25MB，boot.img 通常更大，
          # 所以推荐把它放到 Release / 网盘直链，再把 URL 填进 config.env 的 BOOTIMG_URL）
          echo "BOOTIMG_URL=$(val BOOTIMG_URL)" >> $GITHUB_ENV

      - name: Fetch stock boot image (+ 原厂 kernel 与配置)
        run: |
          WS=$GITHUB_WORKSPACE/kernel_workspace
          mkdir -p $WS
          cd $GITHUB_WORKSPACE
          if [ -f boot.img ]; then
            echo "[ok] 仓库根目录已有 boot.img: $(stat -c%s boot.img) bytes"
          elif [ -n "$BOOTIMG_URL" ]; then
            echo "[dl] 从 BOOTIMG_URL 下载原厂 boot.img ..."
            if curl -L --fail --retry 3 -o boot.img "$BOOTIMG_URL"; then
              ls -lh boot.img
            else
              echo "[warn] boot.img 下载失败（链接过期 / 占位符没替换 / 仓库是 private）"
              rm -f boot.img
            fi
          fi

          if [ -f boot.img ]; then
            # 提前准备好 magiskboot（x86_64），用它解出原厂 kernel，供后面直接复用原厂 .config
            if [ ! -x $WS/magiskboot ]; then
              curl -sL --fail -o $WS/magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v31.1/app-debug.apk || true
              unzip -o -j $WS/magisk.apk lib/x86_64/libmagiskboot.so -d $WS/mb >/dev/null 2>&1 || true
              [ -f $WS/mb/libmagiskboot.so ] && mv $WS/mb/libmagiskboot.so $WS/magiskboot && chmod +x $WS/magiskboot
            fi
            rm -rf $WS/bootunpack && mkdir -p $WS/bootunpack
            cp boot.img $WS/bootunpack/
            ( cd $WS/bootunpack && $WS/magiskboot unpack boot.img ) > $WS/bootunpack/unpack.log 2>&1 || true
            if [ -f $WS/bootunpack/kernel ]; then
              cp $WS/bootunpack/kernel $WS/stock-kernel
              echo "[stock] 原厂 kernel: $(stat -c%s $WS/stock-kernel) bytes"
            else
              echo "[warn] 没能从 boot.img 解出 kernel，后面会退回 defconfig"
            fi
            grep -E 'HEADER_VER|KERNEL_FMT|RAMDISK_FMT|PAGESIZE' $WS/bootunpack/unpack.log || true
          fi

      - name: Setup build environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "DEVICE=$(echo ${{ env.KERNEL_CONFIG }} | sed 's!.*/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev lzop lz4 ccache zip curl unzip git python3 python2 python2-minimal device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          # ---- 关键：一加 sm8250 内核的 scripts/gcc-wrapper.py 是 Python2 语法，
          #       ubuntu-22.04 的 python 指向 python3，直接跑会 SyntaxError，导致
          #       conf/fixdep 等 host 工具编不出来 -> init/Kconfig syntax error -> defconfig 失败。
          #       装好 python2 后把 python 指回 python2，wrapper 原样即可运行。----
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1 || true
          if [ -x /usr/bin/python2 ] && ! command -v python >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          fi
          echo "[py] python -> $(command -v python || echo none) ; $(python --version 2>&1 | head -1)"
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Download Clang Toolchain
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -rf clang clangraw clang.tar.gz && mkdir -p clangraw
          ok=0
          for url in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz" \
            "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz"; do
            echo "[clang] 尝试下载: $url"
            if curl -L --fail --retry 5 --retry-delay 6 --retry-all-errors -o clang.tar.gz "$url" \
               && tar -tzf clang.tar.gz > /dev/null 2>&1; then
              echo "[clang] 下载成功"
              ok=1
              break
            fi
            echo "[clang] 失败，换下一个源"
            rm -f clang.tar.gz
          done
          if [ "$ok" != "1" ]; then
            echo "[error] clang 所有下载源都失败（googlesource 502 / 网络限制）"
            exit 1
          fi
          tar -xf clang.tar.gz -C clangraw
          # googlesource 的 archive 没有顶层目录；GitHub tarball 多一层，两种情况都归一
          if [ -x clangraw/bin/clang ]; then
            mv clangraw clang
          else
            CBIN=$(find clangraw -maxdepth 4 -type f -path '*/bin/clang' | head -1)
            if [ -z "$CBIN" ]; then echo "[error] 解压后找不到 bin/clang"; exit 1; fi
            mv "$(dirname "$(dirname "$CBIN")")" clang
          fi
          "$PWD/clang/bin/clang" --version | head -1
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin" >> $GITHUB_ENV

      # 关键修复：OnePlusOSS 的主内核树本身不完整 —— 树里 91 个软链接指向仓库外的
      # vendor/oplus（sched_assist、rootguard、fingerprint、sensor 等私有代码），
      # 只 clone 主仓库时 init/Kconfig:772 会 can't open file "kernel/sched_assist/Kconfig"。
      # 官方把这块单独放在 android_kernel_modules_and_devicetree_oneplus_sm8250，
      # 而且上游是按 AOSP 目录深度（kernel/<name> + ../vendor）写的软链，必须还原这个结构。
      - name: Download kernel source (+ OPLUS vendor tree)
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -rf src android-kernel
          # 目录深度必须精确：树里的软链按 "../../../vendor/..." 解析，
          # 实测只有把内核树放在 <root>/kernel/<name>（即 root 下 2 层）、
          # vendor 放在 <root>/vendor 时，130 个软链才全部解析成功。
          # 名字必须叫 msm-4.19：vendor 里充电器等驱动用硬写相对路径
          # ../../../../kernel/msm-4.19/drivers/power/supply/qcom/xxx.h 找头文件。
          mkdir -p src/kernel
          SRC=$PWD/src/kernel/msm-4.19

          echo "[src] 主内核树: ${{ env.KERNEL_SOURCE }} (${{ env.KERNEL_SOURCE_BRANCH }})"
          git clone --depth=1 -b ${{ env.KERNEL_SOURCE_BRANCH }} ${{ env.KERNEL_SOURCE }} "$SRC"

          echo "[src] OPLUS vendor 树（同分支）"
          git clone --depth=1 -b ${{ env.KERNEL_SOURCE_BRANCH }} \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250 \
            src/_vendor_repo

          ln -sfn $PWD/src/_vendor_repo/vendor $PWD/src/vendor

          # techpack/{camera,display,video} 在主仓库里是 submodule（gitlink），
          # 仓库没有 .gitmodules 所以 clone 不下来 → make 报 "techpack/camera/Makefile: No such file or directory"。
          # 这三个目录的实体在 vendor 仓库的 kernel/msm-4.19/techpack 里，直接软链过去。
          echo "[src] 挂载 techpack 子模块（camera / display / video）"
          # 必须用「真目录」而不是软链：techpack/Kbuild 用
          #   find $(srctree)/techpack -maxdepth 1 -mindepth 1 -type d
          # 收集子目录，find -type d 不会把软链当目录 → display/camera/video 会被静默跳过，
          # 于是 dsi_panel_need_rewrite_reg / msm_drm_register_client 这些全变成 undefined。
          for d in camera display video; do
            rm -rf "$SRC/techpack/$d"
            cp -a $PWD/src/_vendor_repo/kernel/msm-4.19/techpack/$d "$SRC/techpack/$d"
            if [ -f "$SRC/techpack/$d/Makefile" ]; then echo "  [src][ok] techpack/$d (real dir)"; else echo "  [src][miss] techpack/$d"; fi
          done

          # vendor 里的充电器代码写死了 ../../../../kernel/msm-4.19/drivers/... 这种相对路径，
          # 解析出来是 <root>/vendor/kernel/msm-4.19，需要一个桥接软链指回主内核树。
          ln -sfn $PWD/src/kernel $PWD/src/_vendor_repo/vendor/kernel
          if [ -f $PWD/src/vendor/kernel/msm-4.19/drivers/power/supply/qcom/storm-watch.h ]; then
            echo "[src][ok] vendor/kernel/msm-4.19 桥接"
          else
            echo "[src][miss] vendor/kernel 桥接失败（充电器会编译失败）"
          fi
          # 下游所有步骤仍在 kernel_workspace/android-kernel 下工作，这里只做一个软链接指过去
          ln -sfn "$SRC" $PWD/android-kernel

          echo "[src] 自检：软链接是否都能解析"
          dangle=0
          for l in $(find "$SRC" -maxdepth 6 -type l); do
            [ -e "$l" ] || { dangle=$((dangle+1)); [ $dangle -le 5 ] && echo "  [dangle] ${l#$SRC/}"; }
          done
          echo "[src] dangling=$dangle"
          for f in kernel/sched_assist/Kconfig drivers/oplus/Kconfig vendor/oplus/kernel/oplus_performance/sched_assist/Kconfig; do
            if [ -e "$SRC/$f" ]; then echo "[src][ok] $f"; else echo "[src][miss] $f"; fi
          done

      # 方案A：SUSFS 已内嵌进 KernelSU-Next，删除原 susfs4ksu 补丁与 Fix SUSFS patch rejects 步骤
      - name: Patch 源码树（RTIC 段合并 / genksyms 兼容）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || exit 1
          python3 - <<'PATCHEOF'
          import re, os
          root = os.getcwd()

          # ---- 1) genksyms 不认识「函数返回类型上的 __packed」----
          # 后果：该导出符号版本生成失败 → __kcrctab 里的 .long __crc_xxx 无法重定位 →
          #   relocation R_AARCH64_ABS32 against `__crc_gsi_write_channel_scratch'
          #   can not be used when making a shared object  + dangerous relocation
          p = os.path.join(root, 'drivers/platform/msm/gsi/gsi.c')
          if os.path.exists(p):
              t = open(p, encoding='utf-8', errors='ignore').read()
              old = 'static union __packed gsi_channel_scratch __gsi_update_mhi_channel_scratch'
              new = 'static union gsi_channel_scratch __gsi_update_mhi_channel_scratch'
              if old in t:
                  open(p, 'w', encoding='utf-8').write(t.replace(old, new))
                  print('[PATCH] gsi.c: 返回类型去掉 __packed（genksyms 兼容）')
              else:
                  print('[SKIP] gsi.c: 未找到目标签名（可能已修）')

          # ---- 2) .bss.rtic 并进正常 .bss ----
          # 这棵树的 vmlinux.lds.S 在 _end 之后单独开了一个 `.bss : { RTIC_BSS }`，
          # selinux_state 等符号落在该孤立段里，ADRP(±4GB) 无法寻址 →
          #   relocation truncated to fit: R_AARCH64_ADR_PREL_PG_HI21 against `selinux_state'
          h = os.path.join(root, 'include/asm-generic/vmlinux.lds.h')
          t = open(h, encoding='utf-8').read()
          if '*(.bss.rtic)' not in t:
              t2 = re.sub(r'(\t\t\*\(BSS_MAIN\)[^\n]*\\\n)',
                          lambda m: m.group(1) + '\t\t*(.bss.rtic)\t\t\t\t\t\t\\\n',
                          t, count=1)
              if t2 != t:
                  open(h, 'w', encoding='utf-8').write(t2)
                  print('[PATCH] vmlinux.lds.h: .bss.rtic 并入 .bss')
              else:
                  print('[WARN] vmlinux.lds.h: 未匹配到 BSS_MAIN，未改动')
          else:
              print('[SKIP] vmlinux.lds.h: 已包含 .bss.rtic')

          # ---- 3) 跳过模块符号版本(__crc)校验 ----
          # 现象：/sys/module 里看不到 /vendor/lib/modules 的任何 .ko，模块整批不加载，
          # 传感器 SSC/QMI 服务因此起不来（oplus_sensor_fb 崩在 qmi_wait_for_service）。
          # 原因：本树导出的 __crc 与 ROM 里 vendor 模块记录的 crc 不一致，
          # 模块会以 "disagrees about version of symbol" 被 kernel/module.c 拒绝。
          m = os.path.join(root, 'kernel/module.c')
          t = open(m, encoding='utf-8').read()
          anchor_fn = ("static int check_version(const struct load_info *info,\n"
                       "\t\t\t const char *symname,\n"
                       "\t\t\t struct module *mod,\n"
                       "\t\t\t const s32 *crc)\n"
                       "{\n")
          if 'SKIP_CRC_CHECK' not in t:
              if anchor_fn in t:
                  t = t.replace(anchor_fn, anchor_fn +
                      "\t/* SKIP_CRC_CHECK: 本树 __crc 与 ROM vendor 模块不一致，跳过校验 */\n"
                      "\treturn 1;\n\n", 1)
                  open(m, 'w', encoding='utf-8').write(t)
                  print('[PATCH] kernel/module.c: check_version() 跳过 __crc 校验')
              else:
                  print('[WARN] kernel/module.c: 未匹配 check_version 签名，未改动')
          else:
              print('[SKIP] kernel/module.c: 已打过补丁')

          l = os.path.join(root, 'arch/arm64/kernel/vmlinux.lds.S')
          t = open(l, encoding='utf-8').read()
          if 'RTIC_BSS' in t:
              t2 = re.sub(r'\n\t\.bss : \{[^\n]*\n[^\n]*RTIC_BSS[^\n]*\n\t\}\n', '\n', t, count=1)
              if t2 != t:
                  open(l, 'w', encoding='utf-8').write(t2)
                  print('[PATCH] vmlinux.lds.S: 删除 _end 后的孤立 .bss{RTIC_BSS} 段')
              else:
                  print('[WARN] vmlinux.lds.S: 未匹配到 RTIC_BSS 段')
          else:
              print('[SKIP] vmlinux.lds.S: 无 RTIC_BSS')
          PATCHEOF

      - name: Debug patch (导出内核日志到 /proc/kmsg_dump)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          python3 - <<'DMESGPATCH'
          NL = chr(10)
          p = 'kernel/printk/printk.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          if 'kmsg_dump_read' in s:
              print('[PATCH] printk.c: /proc/kmsg_dump 已存在，跳过')
          else:
              head = '#include <linux/proc_fs.h>' + NL + '#include <linux/uaccess.h>' + NL
              s = s.replace('#include <linux/syscalls.h>', '#include <linux/syscalls.h>' + NL + head, 1)
              if '#include <linux/proc_fs.h>' not in s:
                  s = head + s
              code = (
                  NL + '/* ---- debug: 让 shell 也能读到完整内核日志 ---- */' + NL +
                  'static ssize_t kmsg_dump_read(struct file *file, char __user *ubuf,' + NL +
                  '                              size_t count, loff_t *ppos)' + NL +
                  '{' + NL +
                  '        int len;' + NL +
                  '        if (*ppos)' + NL +
                  '                return 0;' + NL +
                  '        len = syslog_print_all(ubuf, count, false);' + NL +
                  '        if (len < 0)' + NL +
                  '                return len;' + NL +
                  '        *ppos += len;' + NL +
                  '        return len;' + NL +
                  '}' + NL +
                  'static const struct file_operations kmsg_dump_fops = {' + NL +
                  '        .read = kmsg_dump_read,' + NL +
                  '        .llseek = default_llseek,' + NL +
                  '};' + NL +
                  'static int __init kmsg_dump_init(void)' + NL +
                  '{' + NL +
                  '        proc_create("kmsg_dump", 0444, NULL, &kmsg_dump_fops);' + NL +
                  '        return 0;' + NL +
                  '}' + NL +
                  'late_initcall(kmsg_dump_init);' + NL)
              s = s + code
              open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print('[PATCH] printk.c: 已加入 /proc/kmsg_dump (0444)')
          DMESGPATCH
          python3 - <<'SYSPATCH'
          NL = chr(10)
          p = 'kernel/printk/printk.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          anchor = 'static int check_syslog_permissions(int type, int source)' + NL + '{' + NL
          if 'DEBUG_SYSLOG_BYPASS' in s:
              print('[PATCH] check_syslog_permissions 已打过补丁，跳过')
          elif anchor in s:
              s = s.replace(anchor,
                            anchor + '        /* DEBUG_SYSLOG_BYPASS: 跳过 dmesg_restrict/SELinux 限制 */' + NL +
                            '        return 0;' + NL, 1)
              open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print('[PATCH] check_syslog_permissions: 已改为无条件放行（dmesg 可直接读）')
          else:
              print('[PATCH][warn] 未找到 check_syslog_permissions 锚点')
          SYSPATCH
          grep -q "DEBUG_SYSLOG_BYPASS" kernel/printk/printk.c && echo "[PATCH] 校验: syslog 放行补丁已写入" || echo "[PATCH][warn] syslog 放行补丁未写入"
          echo "[PATCH] 校验: kmsg_dump 出现次数 = $(grep -c kmsg_dump kernel/printk/printk.c || true)"
          grep -q "proc_create(\"kmsg_dump\"" kernel/printk/printk.c || { echo "[PATCH][fatal] 调试节点补丁未写入"; exit 1; }

      - name: Patch (跳过 DSP err-ready 等待)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          python3 - <<'ERRREADYPATCH'
          NL = chr(10)
          p = 'drivers/soc/qcom/subsystem_restart.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          anchor = ('static int wait_for_err_ready(struct subsys_device *subsys)' + NL +
                    '{' + NL + '\tint ret;' + NL)
          if 'ERRREADY_SKIP' in s:
              print('[PATCH] subsystem_restart.c: 已打过补丁，跳过')
          elif anchor in s:
              s = s.replace(anchor,
                            anchor +
                            '\t/* ERRREADY_SKIP: /proc/interrupts 显示 error_ready_interrupt 每路只计数 1，' + NL +
                            '\t * 但 completion 被 reinit 清掉，wait_for_completion_timeout 必然超时，' + NL +
                            '\t * 导致 subsystem_get 返回 -110，ADSP/CDSP/SLPI 全部被判失败。 */' + NL +
                            '\tpr_info("[%s]: ERRREADY_SKIP' + chr(92) + 'n", subsys->desc->name);' + NL +
                            '\treturn 0;' + NL + NL, 1)
              open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print('[PATCH] subsystem_restart.c: wait_for_err_ready() 直接返回 0')
          else:
              print('[PATCH][fatal] 未找到 wait_for_err_ready 锚点')
              raise SystemExit(1)
          ERRREADYPATCH
          grep -q "ERRREADY_SKIP" drivers/soc/qcom/subsystem_restart.c && echo "[PATCH] 校验: err-ready 跳过补丁已写入" || { echo "[PATCH][fatal] err-ready 补丁未写入"; exit 1; }

      - name: Patch (SMEM / GLINK 诊断打点)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          python3 - <<'SMEMDBG'
          import re
          NL = chr(10)
          # ---- 1) smem.c: bad_canary 处打印分区物理地址/大小/空闲指针/请求 item ----
          p = 'drivers/soc/qcom/smem.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          BS = chr(92)
          dbg = (NL +
                 '\tdev_err(smem->dev, "SMEMDBG badcanary: phys=0x%08x size=%u cls=%u host0=%hu host1=%hu off_unc=%u off_cache=%u item=%u",' + NL +
                 '\t\tp_desc->phys_base, p_desc->size, p_desc->cacheline,' + NL +
                 '\t\tle16_to_cpu(phdr->host0), le16_to_cpu(phdr->host1),' + NL +
                 '\t\tle32_to_cpu(phdr->offset_free_uncached),' + NL +
                 '\t\tle32_to_cpu(phdr->offset_free_cached), item);')
          stmt_a = ('\tdev_err(smem->dev, "Found invalid canary in hosts %hu:%hu partition' + BS + 'n",' + NL +
                    '\t\tle16_to_cpu(phdr->host0), le16_to_cpu(phdr->host1));')
          stmt_b = ('\tdev_err(smem->dev, "Found invalid canary in hosts %hu:%hu partition' + BS + 'n",' + NL +
                    '\t\t\tle16_to_cpu(phdr->host0), le16_to_cpu(phdr->host1));')
          cnt = 0
          if 'SMEMDBG badcanary' in s:
              print('[PATCH] smem.c: bad_canary 打点已存在，跳过')
          else:
              for st in (stmt_a, stmt_b):
                  cnt += s.count(st)
                  s = s.replace(st, st + dbg)
              if cnt:
                  open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
                  print('[PATCH] smem.c: bad_canary 打点已写入 %d 处' % cnt)
              else:
                  print('[PATCH][fatal] smem.c: 未匹配 bad_canary 锚点')
                  raise SystemExit(1)

          # ---- 2) smem.c: probe 末尾打印 smem 基址 + 所有枚举到的分区 ----
          old2 = '\t__smem = smem;' + NL
          new2 = ('\tdev_err(&pdev->dev, "SMEMDBG region0: aux_base=0x%08x size=%zu num_regions=%d",' + NL +
                  '\t\tsmem->regions[0].aux_base, (size_t)smem->regions[0].size, smem->num_regions);' + NL +
                  '\t{' + NL +
                  '\t\tint si;' + NL +
                  '\t\tfor (si = 0; si < SMEM_HOST_COUNT; si++)' + NL +
                  '\t\t\tif (smem->partition_desc[si].virt_base)' + NL +
                  '\t\t\t\tdev_err(&pdev->dev, "SMEMDBG part host=%d phys=0x%08x size=%u cls=%u",' + NL +
                  '\t\t\t\t\tsi, smem->partition_desc[si].phys_base,' + NL +
                  '\t\t\t\t\tsmem->partition_desc[si].size, smem->partition_desc[si].cacheline);' + NL +
                  '\t}' + NL +
                  '\tif (smem->global_partition_desc.virt_base)' + NL +
                  '\t\tdev_err(&pdev->dev, "SMEMDBG global part phys=0x%08x size=%u cls=%u",' + NL +
                  '\t\t\tsmem->global_partition_desc.phys_base, smem->global_partition_desc.size,' + NL +
                  '\t\t\tsmem->global_partition_desc.cacheline);' + NL + old2)
          if 'SMEMDBG region0' in s:
              print('[PATCH] smem.c: probe 打点已存在，跳过')
          elif s.count(old2) == 1:
              s = s.replace(old2, new2, 1)
              open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print('[PATCH] smem.c: probe 打点已写入')
          else:
              print('[PATCH][fatal] smem.c: 未匹配 probe 锚点(%d)' % s.count(old2))
              raise SystemExit(1)
          SMEMDBG
          python3 - <<'GLINKDBG'
          NL = chr(10)
          BS = chr(92)
          p = 'drivers/rpmsg/qcom_glink_smem.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          anchor = ('\tret = qcom_smem_alloc(remote_pid,' + NL +
                    '\t\t\t      SMEM_GLINK_NATIVE_XPRT_DESCRIPTOR, 32);')
          ins = (NL + '\tdev_err(dev, "GLINKDBG xprt_desc alloc: remote_pid=%u ret=%d' + BS + 'n",' + NL +
                 '\t\tremote_pid, ret);')
          if 'GLINKDBG' in s:
              print('[PATCH] glink: 已打过补丁，跳过')
          elif anchor in s:
              s = s.replace(anchor, anchor + ins, 1)
              open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print('[PATCH] glink: remote_pid/ret 打点已写入')
          else:
              print('[PATCH][fatal] glink: 未匹配 qcom_smem_alloc 锚点')
              raise SystemExit(1)
          GLINKDBG
          python3 - <<'IOMEMDBG'
          p = 'kernel/resource.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          old = 'proc_create_seq_data("iomem", 0, NULL, &resource_op, &iomem_resource);'
          new = 'proc_create_seq_data("iomem", 0444, NULL, &resource_op, &iomem_resource);'
          if '0444, NULL, &resource_op' in s:
              print('[PATCH] resource.c: /proc/iomem 已可读，跳过')
          elif old in s:
              open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s.replace(old, new, 1))
              print('[PATCH] resource.c: /proc/iomem 改为 0444')
          else:
              print('[PATCH][fatal] resource.c: 未匹配 iomem 锚点')
              raise SystemExit(1)
          IOMEMDBG
          grep -q "SMEMDBG badcanary" drivers/soc/qcom/smem.c || { echo "[PATCH][fatal] smem 打点未写入"; exit 1; }
          grep -q "0444, NULL, &resource_op" kernel/resource.c || { echo "[PATCH][fatal] iomem 未放开"; exit 1; }
          echo "[PATCH] 校验通过"

      - name: Patch (SMEM 条目 dump 诊断)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          python3 - <<'SMDMP'
          NL = chr(10)
          BS = chr(92)
          p = 'drivers/soc/qcom/smem.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          if 'SMEMDBG hdrw' in s:
              print('[PATCH] smem.c: entry dump 已存在，跳过')
          else:
              a1 = '\tphdr = p_desc->virt_base;' + NL
              i1 = (a1 +
                    '\t{' + NL +
                    '\t\tstatic int smem_dbg_once;' + NL +
                    '\t\tif (!smem_dbg_once) {' + NL +
                    '\t\t\tsmem_dbg_once = 1;' + NL +
                    '\t\t\tprintk(KERN_ERR "SMEMDBG hdrw %08x %08x %08x %08x %08x %08x %08x %08x -- %08x %08x %08x %08x' + BS + 'n",' + NL +
                    '\t\t\t       ((u32 *)phdr)[0], ((u32 *)phdr)[1], ((u32 *)phdr)[2], ((u32 *)phdr)[3],' + NL +
                    '\t\t\t       ((u32 *)phdr)[4], ((u32 *)phdr)[5], ((u32 *)phdr)[6], ((u32 *)phdr)[7],' + NL +
                    '\t\t\t       ((u32 *)phdr)[8], ((u32 *)phdr)[9], ((u32 *)phdr)[10], ((u32 *)phdr)[11]);' + NL +
                    '\t\t}' + NL +
                    '\t}' + NL)
              a2 = ('\twhile ((hdr < end) && ((hdr + 1) < end)) {' + NL +
                    '\t\tif (hdr->canary != SMEM_PRIVATE_CANARY)')
              i2 = ('\twhile ((hdr < end) && ((hdr + 1) < end)) {' + NL +
                    '\t\t{' + NL +
                    '\t\t\tstatic int smem_dbg_cnt;' + NL +
                    '\t\t\tif (smem_dbg_cnt < 30) {' + NL +
                    '\t\t\t\tprintk(KERN_ERR "SMEMDBG w[%d] off=%d can=%04x itm=%u sz=%u padh=%u u16at8=%u req=%u' + BS + 'n",' + NL +
                    '\t\t\t\t       smem_dbg_cnt, (int)((u8 *)hdr - (u8 *)phdr), hdr->canary,' + NL +
                    '\t\t\t\t       le16_to_cpu(hdr->item), le32_to_cpu(hdr->size),' + NL +
                    '\t\t\t\t       le16_to_cpu(hdr->padding_hdr), *(u16 *)((u8 *)hdr + 8), item);' + NL +
                    '\t\t\t\tsmem_dbg_cnt++;' + NL +
                    '\t\t\t}' + NL +
                    '\t\t}' + NL +
                    '\t\tif (hdr->canary != SMEM_PRIVATE_CANARY)')
              a3 = ('\t\tle16_to_cpu(phdr->host0), le16_to_cpu(phdr->host1));' + NL +
                    NL +
                    '\treturn -EINVAL;' + NL + '}' + NL)
              i3 = ('\t\tle16_to_cpu(phdr->host0), le16_to_cpu(phdr->host1));' + NL +
                    '\tprintk(KERN_ERR "SMEMDBG bad off=%d req=%u bytes %08x %08x %08x %08x' + BS + 'n",' + NL +
                    '\t       (int)((u32 *)hdr - (u32 *)phdr), item,' + NL +
                    '\t       ((u32 *)hdr)[0], ((u32 *)hdr)[1], ((u32 *)hdr)[2], ((u32 *)hdr)[3]);' + NL +
                    '\tprintk(KERN_ERR "SMEMDBG meta size=%u unc=%u cache=%u e0 %08x %08x %08x %08x' + BS + 'n",' + NL +
                    '\t       le32_to_cpu(phdr->size), le32_to_cpu(phdr->offset_free_uncached),' + NL +
                    '\t       le32_to_cpu(phdr->offset_free_cached),' + NL +
                    '\t       ((u32 *)((u8 *)phdr + 32))[0], ((u32 *)((u8 *)phdr + 32))[1],' + NL +
                    '\t       ((u32 *)((u8 *)phdr + 32))[2], ((u32 *)((u8 *)phdr + 32))[3]);' + NL +
                    '\t{' + NL +
                    '\t\tint i, f = -1;' + NL +
                    '\t\tfor (i = 0; i < 512; i++)' + NL +
                    '\t\t\tif (*(u16 *)((u8 *)phdr + i) == 0xa5a5) {' + NL +
                    '\t\t\t\tf = i;' + NL +
                    '\t\t\t\tbreak;' + NL +
                    '\t\t\t\t}' + NL +
                    '\t\tprintk(KERN_ERR "SMEMDBG firstcanary off=%d' + BS + 'n", f);' + NL +
                    '\t}' + NL +
                    NL +
                    '\treturn -EINVAL;' + NL + '}' + NL)
              ok = 0
              for a, i in ((a1, i1), (a2, i2), (a3, i3)):
                  if a in s:
                      s = s.replace(a, i, 1)
                      ok += 1
                  else:
                      print('[PATCH][fatal] smem.c: 锚点未匹配: ' + a.split(NL)[0])
              if ok != 3:
                  raise SystemExit(1)
              open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print('[PATCH] smem.c: entry dump 写入 3 处')
          SMDMP
      - name: Setup KernelSU-Next (standalone SUSFS)
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || exit 1
          if [ ! -d "drivers" ]; then
            echo "致命错误: 当前目录找不到 drivers 文件夹，源码不完整！"
            exit 1
          fi
          # legacy-susfs 分支：SUSFS 作为自包含驱动集成，无需手动打 fs 补丁
          git clone --depth=1 -b legacy-susfs https://github.com/Youffx/KernelSU-Next.git kernelsu_src
          ln -sfn $(pwd)/kernelsu_src/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          bash kernelsu_src/kernel/setup.sh
          # 4.19 内核 API 适配（仅当目标确为 4.19 时需要；其余版本这些符号本就不存在，替换无副作用）
          grep -rl "#include <linux/pgtable.h>" kernelsu_src/kernel | xargs -r sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g'
          grep -rl "strncpy_from_user_nofault" kernelsu_src/kernel | xargs -r sed -i 's/strncpy_from_user_nofault/strncpy_from_unsafe/g'
          grep -rl "copy_to_kernel_nofault" kernelsu_src/kernel | xargs -r sed -i 's/copy_to_kernel_nofault/probe_kernel_write/g'
          grep -rl "copy_from_kernel_nofault" kernelsu_src/kernel | xargs -r sed -i 's/copy_from_kernel_nofault/probe_kernel_read/g'
          KSU_VERSION=$(cd kernelsu_src && expr $(git rev-list --count HEAD) + 10200)
          echo "UPLOADNAME=-KernelSU-Next_$KSU_VERSION" >> $GITHUB_ENV

      - name: Add KernelSU manual hooks
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          python3 - <<'PYEOF'
          import sys
          NL = chr(10)
          def read(p):
              f = open(p, 'r', errors='surrogateescape'); s = f.read(); f.close(); return s
          def write(p, s):
              f = open(p, 'w', errors='surrogateescape'); f.write(s); f.close()
          # 找不到锚点只告警跳过，不再 sys.exit 中断整次编译
          def before(path, find_str, lines, skip):
              try:
                  s = read(path)
              except FileNotFoundError:
                  print('[SKIP]', path, '| file not found'); return
              if skip in s:
                  print('[SKIP]', path); return
              i = s.find(find_str)
              if i < 0:
                  print('[WARN]', path, '| anchor not found (skip):', find_str); return
              pos = s.rfind(NL, 0, i) + 1
              s = s[:pos] + NL.join(lines) + NL + s[pos:]
              write(path, s); print('[OK]', path)
          def after(path, find_str, lines, skip):
              try:
                  s = read(path)
              except FileNotFoundError:
                  print('[SKIP]', path, '| file not found'); return
              if skip in s:
                  print('[SKIP]', path); return
              i = s.find(find_str)
              if i < 0:
                  print('[WARN]', path, '| anchor not found (skip):', find_str); return
              j = i + len(find_str)
              s = s[:j] + NL + NL.join(lines) + s[j:]
              write(path, s); print('[OK]', path)
          def replace(path, find_str, lines, skip):
              try:
                  s = read(path)
              except FileNotFoundError:
                  print('[SKIP]', path, '| file not found'); return
              if skip in s:
                  print('[SKIP]', path); return
              i = s.find(find_str)
              if i < 0:
                  print('[WARN]', path, '| anchor not found (skip):', find_str); return
              s = s[:i] + NL.join(lines) + s[i+len(find_str):]
              write(path, s); print('[OK]', path)

          before('fs/exec.c', 'static int do_execveat_common(',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'extern bool ksu_execveat_hook __read_mostly;',
          'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,',
          'void *envp, int *flags);',
          'extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,',
          'void *argv, void *envp, int *flags);',
          '#endif'], 'ksu_handle_execveat_sucompat')
          replace('fs/exec.c', 'return __do_execve_file(fd, filename, argv, envp, flags, NULL);',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'if (unlikely(ksu_execveat_hook))',
          'ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);',
          'else',
          'ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);',
          '#endif',
          'return __do_execve_file(fd, filename, argv, envp, flags, NULL);'],
          'ksu_handle_execveat_sucompat(&fd')
          before('fs/open.c', 'long do_faccessat(',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,',
          'int *flags);',
          '#endif'], 'ksu_handle_faccessat(&dfd')
          # 注意：锚点必须用 do_faccessat 内部唯一的语句。
          # 原本用的 'unsigned int lookup_flags = LOOKUP_FOLLOW;' 在该文件里第一次出现是
          # do_sys_truncate()（第132行），会把钩子插错函数，导致 dfd/filename/mode 未声明。
          before('fs/open.c', 'if (mode & ~S_IRWXO)',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'ksu_handle_faccessat(&dfd, &filename, &mode, NULL);',
          '#endif'], 'ksu_handle_faccessat(&dfd')
          before('fs/read_write.c', 'ssize_t vfs_read(struct file *file',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'extern bool ksu_vfs_read_hook __read_mostly;',
          'extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,',
          'size_t *count_ptr, loff_t **pos);',
          '#endif'], 'ksu_handle_vfs_read(&file')
          try:
              s = read('fs/read_write.c')
              if 'ksu_handle_vfs_read(&file' not in s:
                  i = s.find('ssize_t vfs_read(struct file *file')
                  j = s.find('ssize_t ret;', i)
                  if i < 0 or j < 0:
                      print('[WARN] fs/read_write.c | vfs_read body not found (skip)')
                  else:
                      j = j + len('ssize_t ret;')
                      s = s[:j] + NL + NL.join(['#ifdef CONFIG_KSU_MANUAL_HOOK',
                      'if (unlikely(ksu_vfs_read_hook))',
                      'ksu_handle_vfs_read(&file, &buf, &count, &pos);',
                      '#endif']) + s[j:]
                      write('fs/read_write.c', s)
                      print('[OK] fs/read_write.c')
              else:
                  print('[SKIP] fs/read_write.c')
          except FileNotFoundError:
              print('[SKIP] fs/read_write.c | file not found')
          before('fs/stat.c', 'int vfs_statx(',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);',
          '#endif'], 'ksu_handle_stat(&dfd')
          after('fs/stat.c', 'unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'ksu_handle_stat(&dfd, &filename, &flags);',
          '#endif'], 'ksu_handle_stat(&dfd')
          before('drivers/input/input.c', 'static void input_handle_event(',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'extern bool ksu_input_hook __read_mostly;',
          'extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);',
          '#endif'], 'ksu_handle_input_handle_event(&type')
          after('drivers/input/input.c', 'int disposition = input_get_disposition(dev, type, code, &value);',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'if (unlikely(ksu_input_hook))',
          'ksu_handle_input_handle_event(&type, &code, &value);',
          '#endif'], 'ksu_handle_input_handle_event(&type')
          # 注意：KernelSU-Next(legacy-susfs) 源码里没有 ksu_handle_devpts 这个符号，
          # 注入会在链接阶段报 undefined reference，故这里不再给 fs/devpts/inode.c 加钩子
          # before('fs/devpts/inode.c', ...) 已移除
          # KernelSU-Next 的 Kbuild 用 grep "ksu_handle_sys_reboot" kernel/reboot.c 判断
          # 是否已手动集成钩子，缺失会直接 $(error No hooks were defined) 中断编译
          before('kernel/reboot.c', 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);',
          '#endif'], 'ksu_handle_sys_reboot(magic1')
          after('kernel/reboot.c', 'int ret = 0;',
          ['#ifdef CONFIG_KSU_MANUAL_HOOK',
          'ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);',
          '#endif'], 'ksu_handle_sys_reboot(magic1')
          PYEOF

      - name: Build kernel
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          # ========== -0. 全局关掉 -Werror ==========
          # 厂商/OPLUS 代码里大量老式写法（如 bool tp_boot_mode_normal() 没写 void），
          # 配 -Wstrict-prototypes + -Werror 直接报 error：
          #   touchpanel_common_driver.c:1673: error: this old-style function definition ...
          # 这类告警不影响功能，把树里所有 Makefile/Kbuild 的 -Werror 换成 -Wno-error。
          echo "[fix] 全局移除 -Werror（保留告警）..."
          # 注意：vendor 目录是软链进来的，grep -r 默认不跟软链，
          # 所以必须用 find -L 遍历（上一版漏了 net/oplus_modules 这类软链目录）。
          n=0
          while IFS= read -r f; do
            if grep -q -- "-Werror" "$f"; then sed -i 's/-Werror/-Wno-error/g' "$f"; n=$((n+1)); fi
          done < <(find -L . \( -name 'Makefile' -o -name 'Makefile.*' -o -name 'Kbuild' -o -name '*.mk' \) -type f 2>/dev/null)
          echo "[fix] 已处理 $n 个文件"

          # clang 12 不支持 -fmerge-constants，内核 Makefile 里那一行会刷出
          # "optimization flag '-fmerge-constants' is not supported"，直接删掉。
          sed -i '/fmerge-constants/d' Makefile && echo "[fix] 已移除 -fmerge-constants"

          # ========== 0. 4.19 没有 strscpy_pad（4.20 才加入），KSU-Next 版本判断误以为存在 ==========
          # 强制 kernel_compat.h 的 __strscpy_pad 走 strscpy+memset 回退分支
          COMPAT=drivers/kernelsu/compat/kernel_compat.h
          if [ -f "$COMPAT" ]; then
            sed -i 's/^#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 14, 222)$/#if 0/' "$COMPAT"
            echo "[fix] patched $COMPAT -> strscpy_pad fallback"
          else
            echo "[warn] $COMPAT not found, skip"
          fi
          # =====================================================================

          # ========== 0.5 提前给 fs/namespace.c 补 can_umount / path_umount ==========
          # KSU-Next 的 Kbuild 也会补，但它在 drivers/kernelsu 阶段才执行，
          # 那时 fs/namespace.o 往往已经编译完 → 链接期报 undefined reference to 'path_umount'
          python3 - <<'NSEOF'
          ns = 'fs/namespace.c'
          try:
              s = open(ns).read()
          except FileNotFoundError:
              print('[SKIP] namespace.c not found'); raise SystemExit
          if 'int path_umount(' in s:
              print('[SKIP] path_umount already present')
          else:
              code = '''
          /* KernelSU-Next: umount helpers backported for 4.19 vendor tree */
          static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          
          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }
          
          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;
          
          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }
          '''
              s = s.rstrip('\n') + '\n' + code
              open(ns, 'w').write(s)
              print('[OK] fs/namespace.c: added can_umount + path_umount')
          # fs/internal.h 里补上声明
          ih = 'fs/internal.h'
          try:
              t = open(ih).read()
          except FileNotFoundError:
              t = None
          if t and 'int path_umount(' not in t:
              t = t.rstrip('\n') + '\n' + 'int path_umount(struct path *path, int flags);\n'
              open(ih, 'w').write(t)
              print('[OK] fs/internal.h: added path_umount declaration')
          NSEOF
          # =====================================================================

          # ========== 1. 只删 synaptics Kconfig 非法字节，保留驱动配置（必须早于任何 make） ==========
          echo "[fix] strip bad bytes in synaptics Kconfig (keep driver) ..."
          for f in $(find drivers -path '*touchscreen*' -name 'Kconfig*' 2>/dev/null); do
            echo "[fix] clean -> $f"
            [ -f "$f.bak" ] || cp "$f" "$f.bak"
            # LC_ALL=C 强制按字节处理，只删 >=0x80 的非法字节，ASCII 内容全保留
            LC_ALL=C sed -i 's/[^[:print:][:space:]]//g' "$f"
            # 校验：清理后若仍有非 ASCII 字节，用 tr 做纯字节级兜底删除
            if LC_ALL=C grep -q '[^[:print:][:space:]]' "$f"; then
              echo "[warn] 仍有残留坏字节，二次兜底删除"
              LC_ALL=C tr -d '\200-\377' < "$f.bak" > "$f"
            fi
          done
          # =====================================================================

          # ========== 1.5 gcc-wrapper.py 保持原样，绝不改写 ==========
          # 根因：scripts/gcc-wrapper.py 是本内核的 CC 包装器（每次编译都会跑），
          # 且是 Python2 语法。之前用 sed 就地改它会把脚本改坏，反而触发
          # "gcc-version.sh: printf: Is/your/PATH" 与 init/Kconfig 语法错误。
          # 正解已在依赖安装段完成：装 python2 并让 python 指向 python2，wrapper 原样运行。
          echo "[fix] gcc-wrapper.py 保持原样，python 版本：$(python --version 2>&1 | head -1)"
          # =====================================================================

          # ========== 2. 工具链：LLVM 模式，防回退到系统 clang-12 ==========
          export PATH=$CLANG_PATH:$PATH
          echo "[toolchain] which clang -> $(which clang || echo none)"
          echo "[toolchain] clang version -> $($CLANG_PATH/clang --version 2>/dev/null | head -1 || echo MISSING)"
          if [ ! -x "$CLANG_PATH/clang" ]; then
            echo "致命错误: $CLANG_PATH/clang 不存在（下载/解压失败？），终止以免用错编译器"
            exit 1
          fi

          # sm8250 / 4.19 厂商树：这棵树 Makefile 第413行无条件用 gcc-wrapper.py 覆盖 CC，
          # 且 REAL_CC 只在 LLVM 为空时定义 → 绝不能传 LLVM=1，必须显式 CC=clang
          # 厂商特性开关：不再手工挑几个，直接用 OnePlus 官方 oplus_native_features.mk 的全量清单
          # （这份清单就是出厂内核编译时用的那份，缺一个就会少编一个 oplus 驱动，
          #   典型后果：oplus_sensor_fb / sscrpcd 这类 userspace 找不到内核侧的设备节点或接口）
          FEAT_MK_URL="https://raw.githubusercontent.com/OnePlusOSS/android_kernel_oneplus_sm8250/$KERNEL_SOURCE_BRANCH/oplus_native_features.mk"
          FEAT_MK=$GITHUB_WORKSPACE/kernel_workspace/oplus_native_features.mk
          curl -sL --retry 3 -o "$FEAT_MK" "$FEAT_MK_URL" || true
          FEAT_ARGS=$(grep -E '^OPLUS_[A-Za-z0-9_]+=[^ ]+$' "$FEAT_MK" | grep -v 'TARGET_PRODUCT' | tr '\n' ' ')
          FEAT_N=$(echo $FEAT_ARGS | wc -w)
          echo "[feat] 厂商特性开关数量: $FEAT_N"
          [ "$FEAT_N" -gt 100 ] || { echo "[feat][warn] 特性清单异常，回退到最小集合"; FEAT_ARGS="OPLUS_FEATURE_WIFI_ROUTERBOOST=1 OPLUS_FEATURE_ADFR_KERNEL=yes OPLUS_FEATURE_PROCESS_RECLAIM=yes OPLUS_FEATURE_UFSPLUS=1 OPLUS_FEATURE_UFS_SHOW_LATENCY=1 OPLUS_FEATURE_PADL_STATISTICS=1"; }
          MAKE_ARGS="O=out ARCH=$ARCH CC=clang HOSTCC=clang CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-Wno-error $FEAT_ARGS"
          if [ "$DISABLE_LTO" = "true" ]; then
            MAKE_ARGS="$MAKE_ARGS CONFIG_LTO_NONE=y"
          fi

          # ========== 3. 生成配置：优先直接用原厂 kernel 内置的 .config ==========
          # defconfig（kona-perf_defconfig）只是基础骨架，很多 OPLUS 特性开关在里面是关的，
          # 而树里被 patch 过的核心文件（ufshcd / drm_sysfs / net/ipv4 ...）无条件引用
          # oplus_router_boost_handler、dsi_panel_need_rewrite_reg、ufsf_* 这些符号，
          # 开关一关就链接期 undefined reference。直接用原厂 .config 才能保证 =y/=m 判定完全一致。
          STOCKCFG=$GITHUB_WORKSPACE/kernel_workspace/stock-kernel
          mkdir -p out
          rm -f out/.config
          if [ -f "$STOCKCFG" ]; then
            echo "[cfg] 用原厂 kernel 内置配置做基线"
            # scripts/extract-ikconfig 依赖外部工具、在 runner 上容易静默失败，
            # 这里直接用 python 扫 IKCFG_ST..IKCFG_ED 区间并 gunzip，稳。
            python3 - "$STOCKCFG" out/.config <<'IKPY'
          import sys, zlib
          src, dst = sys.argv[1], sys.argv[2]
          data = open(src, 'rb').read()
          i = data.find(b'IKCFG_ST')
          j = data.find(b'IKCFG_ED', i)
          if i < 0 or j < 0:
              print('[cfg] 原厂 kernel 里没找到 IKCFG_ST/IKCFG_ED')
              sys.exit(1)
          raw = data[i + 8:j]
          for wbits in (16 + zlib.MAX_WBITS, -zlib.MAX_WBITS):
              try:
                  txt = zlib.decompress(raw, wbits)
                  break
              except Exception:
                  txt = None
          if not txt:
              print('[cfg] IKCONFIG 解压失败')
              sys.exit(1)
          open(dst, 'wb').write(txt)
          print('[cfg] 抽取成功，行数:', len(txt.splitlines()))
          IKPY
            if [ ! -s out/.config ]; then
              echo "[warn] python 抽取失败，退回 scripts/extract-ikconfig"
              bash scripts/extract-ikconfig "$STOCKCFG" > out/.config 2>/dev/null || true
            fi
            if [ -s out/.config ]; then
              echo "[cfg] 原厂配置行数: $(wc -l < out/.config)"
              cp out/.config $GITHUB_WORKSPACE/kernel_workspace/stock.config
            else
              echo "[error] 原厂配置抽取失败。不再退回 defconfig（那套开关不全，必然链接失败）"
              exit 1
            fi
          fi
          if [ ! -s out/.config ]; then
            echo "[cfg] make $KERNEL_CONFIG"
            make $MAKE_ARGS $KERNEL_CONFIG
          fi
          # 关键：这棵源码树（OnePlus-9R/kernel_oneplus_sm8250-9R）的 LOCALVERSION 被改成了
          # "-Havoc-sm8250"，编出来的 vermagic 是 4.19.157-Havoc-sm8250+，
          # 与原厂 4.19.157-perf+ 不一致 → vendor 内核模块全部拒绝加载 → 开不了机。
          # 这里强制改回原厂 vermagic "-perf"，并关掉 AUTO 以免多出 -g<sha> 后缀。
          ./scripts/config --file out/.config --set-str LOCALVERSION "-perf"
          ./scripts/config --file out/.config --disable LOCALVERSION_AUTO
          # 关键 2：原厂内核 CONFIG_MODULE_SIG_FORCE=y，只信任一加自己的签名密钥。
          # 我们自编内核内置的是 CI 临时密钥，vendor 里一加签名的 .ko 会被直接拒绝加载
          # （exec format error / invalid module format）→ 关键驱动缺失 → 开不了机。
          # 关掉 FORCE 后，签名不匹配只 taint 内核，模块照常加载。
          ./scripts/config --file out/.config --disable MODULE_SIG_FORCE
          echo "[cfg] LOCALVERSION=$(grep '^CONFIG_LOCALVERSION=' out/.config)"
          echo "[cfg] MODULE_SIG: $(grep -E '^CONFIG_MODULE_SIG' out/.config | tr '\n' ' ')"
          echo "[cfg] olddefconfig (non-interactive)"
          make $MAKE_ARGS olddefconfig < /dev/null || true
          echo "[cfg] 关键开关自检（缺任何一个都会在链接期 undefined reference）："
          grep -E '^CONFIG_(DRM_MSM|SCSI_UFS_QCOM|DM_CRYPT|MODULES|OPLUS_SYSTEM_KERNEL_QCOM)=' out/.config || true
          for k in DRM_MSM SCSI_UFS_QCOM DM_CRYPT; do
            grep -q "^CONFIG_$k=y" out/.config || echo "[cfg][warn] CONFIG_$k 不是 y，链接很可能失败"
          done
          [ "$ADD_KPROBES_CONFIG"   = "true" ] && ./scripts/config --file out/.config -e KPROBES
          [ "$ADD_OVERLAYFS_CONFIG" = "true" ] && ./scripts/config --file out/.config -e OVERLAY_FS
          [ "$ENABLE_KERNELSU"      = "true" ] && ./scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK --disable KSU_KPROBES_HOOK
          if [ "$ENABLE_SUSFS" = "true" ]; then
            ./scripts/config --file out/.config -e KSU_SUSFS -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP -e KSU_SUSFS_SUS_PATH
          fi
          [ "$DISABLE_CC_WERROR" = "true" ] && ./scripts/config --file out/.config --disable CC_WERROR
          # 用 clang(LLVM=1) 编译时 GCC 插件不支持，必须全关：否则会调用 Python2 的
          # gcc-wrapper.py，触发 SyntaxError / gcc-version.sh printf / init/Kconfig 报错
          echo "[cfg] disable GCC plugins (required for LLVM/clang build)"
          ./scripts/config --file out/.config --disable GCC_PLUGINS \
            --disable GCC_PLUGIN_RANDSTRUCT --disable GCC_PLUGIN_LATENT_ENTROPY \
            --disable GCC_PLUGIN_STRUCTLEAK --disable GCC_PLUGIN_STRUCTLEAK_BYREF_ALL \
            --disable GCC_PLUGIN_STACKLEAK --disable GCC_PLUGIN_RANDSTRUCT_PERFORMANCE || true
          # 改完开关后再跑一次 olddefconfig 吸收改动，仍非交互
          make $MAKE_ARGS olddefconfig < /dev/null || true
          # =====================================================================

          # ========== 4. 编译前校验：清掉会漏进 clang 命令行的非法 bool/字符串值 ==========
          echo "[check] 规范化 .config 中 bool/字符串值 (true|false|yes|no) ..."
          echo "[check] 修正前命中："
          grep -nE '=(true|false|yes|no)$|="(true|false|yes|no)"$' out/.config || echo "  无"
          # 无引号与带引号的情况一起处理：=true / ="true" -> =y；=false / ="false" -> =n
          sed -i -E \
            -e '/^CONFIG_/ s/=(true|yes)$/=y/' \
            -e '/^CONFIG_/ s/=(false|no)$/=n/' \
            -e '/^CONFIG_/ s/="(true|yes)"$/=y/' \
            -e '/^CONFIG_/ s/="(false|no)"$/=n/' \
            out/.config
          # 修正后再跑一次 olddefconfig 吸收改动，杜绝残留值进编译参数
          make $MAKE_ARGS olddefconfig < /dev/null || true

          # ========== 3.5 最后一步强制写回开关（必须在所有 olddefconfig 之后）==========
          # olddefconfig 会把 Kconfig 依赖不满足的符号重新裁掉，之前放在中间就被裁了。
          # 这些 obj-$(CONFIG_xxx) 只被 Makefile 读，写回 =y 就一定参与编译：
          #   UFSFEATURE/UFSHPB/UFSHID/UFSTW -> drivers/scsi/ufs/ufsfeature.o（ufsf_*）
          #   DRM_OPLUS                      -> techpack/display/msm/../oplus（adfr / te_refcount）
          # 以原厂 .config 为唯一基准，逐键对齐：原厂有、但被 olddefconfig 裁掉/改掉的键，
          # 全部按原厂值写回。这样内核配置 ≈ 出 ROM 的那颗内核，排除「配置偏离」这条变量。
          # 覆盖项只有四个：MODULE_SIG_FORCE 关（否则 vendor 模块签名对不上）、
          # DUMP_TASKS_MEM 关（本树无 update_user_tasklist 实现）、链接必需的白名单、LOCALVERSION。
          # 原厂纯净配置：Build kernel 开头解出的那份（6676 行），临时目录路径兜底
          STOCKPLAIN=$GITHUB_WORKSPACE/kernel_workspace/stock.config
          [ -s "$STOCKPLAIN" ] || STOCKPLAIN=$STOCKCFG
          echo "[cfg] 对齐基准: $STOCKPLAIN ($(wc -l < "$STOCKPLAIN") 行)"
          python3 - "$STOCKPLAIN" out/.config <<CFGEOF
          import sys, re
          stock, cur = sys.argv[1], sys.argv[2]

          def parse(path):
              d = {}
              for raw in open(path, encoding='utf-8', errors='ignore'):
                  line = raw.rstrip('\n')
                  m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=.*$', line)
                  if m:
                      d[m.group(1)] = line
                      continue
                  m2 = re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$', line)
                  if m2:
                      d[m2.group(1)] = '# ' + m2.group(1) + ' is not set'
              return d

          cur_d = parse(cur)
          stock_d = parse(stock)
          # 工具链身份类键交给 Kconfig 自动识别，不照抄原厂（原厂是 clang 10，我们编的是 clang 12）
          skip_pref = ('CONFIG_CC_', 'CONFIG_AS_', 'CONFIG_LD_', 'CONFIG_CLANG_VERSION',
                       'CONFIG_GCC_VERSION', 'CONFIG_CC_VERSION_TEXT', 'CONFIG_CC_IS_')
          changed = []
          for k, v in stock_d.items():
              if k.startswith(skip_pref):
                  continue
              if cur_d.get(k) != v:
                  changed.append(k)
                  cur_d[k] = v
          for k in ('CONFIG_MODULE_SIG_FORCE', 'CONFIG_DUMP_TASKS_MEM'):
              cur_d[k] = '# %s is not set' % k
          # 4MB printk 缓冲区（原 512KB/1MB），否则 oplus 充电 iio 报错的刷屏会在
          # 开机 80 秒左右把 0~80 秒的启动日志全部冲掉，抓不到 DSP/PIL 初始化现场。
          cur_d['CONFIG_LOG_BUF_SHIFT'] = 'CONFIG_LOG_BUF_SHIFT=22'
          for k in ('UFSFEATURE', 'UFSHPB', 'UFSHID', 'UFSTW', 'DRM_OPLUS',
                    'PROCESS_RECLAIM_ENHANCE', 'OPLUS_FEATURE_WIFI_ROUTERBOOST',
                    'OPLUS_FEATURE_DATA_EVAL'):
              cur_d['CONFIG_' + k] = 'CONFIG_%s=y' % k
          with open(cur, 'w', encoding='utf-8') as f:
              for k in sorted(cur_d):
                  f.write(cur_d[k] + '\n')
          print('[cfg] 按原厂配置回写的键数: %d' % len(changed))
          print('[cfg] 回写样例: %s' % ' '.join(changed[:60]))
          for k in ('CONFIG_DM_DEFAULT_KEY', 'CONFIG_BLK_INLINE_ENCRYPTION', 'CONFIG_DM_CRYPT',
                    'CONFIG_SCSI_UFS_CRYPTO', 'CONFIG_FSCRYPTO', 'CONFIG_OVERLAY_FS',
                    'CONFIG_ANDROID_BINDER_IPC'):
              print('[cfg] %s: %s' % (k, cur_d.get(k, 'MISSING')))
          CFGEOF
          echo "[cfg] 最终开关: $(grep -E '^CONFIG_(UFSFEATURE|UFSHPB|DRM_OPLUS|PROCESS_RECLAIM_ENHANCE)=' out/.config | tr '\n' ' ')"
          echo "[cfg] 链接相关: $(grep -E '^CONFIG_(HAVE_ARCH_PREL32_RELOCATIONS|MODVERSIONS|RELOCATABLE|MODULE_SIG_ALL)=' out/.config | tr '\n' ' ')"
          echo "[check] 修正后仍命中（应为空）："
          grep -nE '=(true|false|yes|no)$|="(true|false|yes|no)"$' out/.config || echo "  干净"

          echo "[check] 标志类环境变量："
          env | grep -iE '^(KCFLAGS|KCPPFLAGS|KAFLAGS|HOSTCFLAGS|HOSTLDFLAGS|CC|LD|AS)=' || echo "  无"
          # 无条件清掉所有可能漏进编译参数的变量（含值为 true/false 的厂商开关）
          echo "[check] 清理污染变量 ..."
          for v in KCFLAGS KCPPFLAGS KAFLAGS CFLAGS CPPFLAGS LDFLAGS HOSTCFLAGS HOSTLDFLAGS; do
            printenv "$v" >/dev/null 2>&1 && echo "  unset $v (原值: $(printenv $v))"
            unset "$v" || true
          done
          for v in $(env | grep -E '=(true|false)$' | cut -d= -f1); do
            echo "  unset $v"
            unset "$v" || true
          done

          echo "[check] synaptics 残留非 ASCII 检查："
          find drivers -path '*touchscreen*' -name 'Kconfig*' -exec sh -c 'LC_ALL=C grep -l "[^[:print:][:space:]]" "$1" 2>/dev/null && echo "  仍有问题: $1"' _ {} \; || echo "  干净"
          # ===================================================================

          # ========== 4.5 定位 'true' 来源（.config/env 已排除，只剩源码树） ==========
          echo "[diag] ===== 谁把 true 写进了构建标志 ====="
          echo "[diag] --- Makefile / scripts 层 ---"
          grep -rnE '(KBUILD_CFLAGS|KBUILD_HOSTCFLAGS|HOSTCFLAGS|ccflags-y|EXTRA_CFLAGS|KCFLAGS)[[:space:]]*\+?=' \
            Makefile arch/arm64/Makefile scripts/ 2>/dev/null | grep -i 'true' || echo "  无"
          echo "[diag] --- 源码树 mk/其他层（前 20 条） ---"
          grep -rnE '(CFLAGS|LDFLAGS|KBUILD_)[A-Z_]*[[:space:]]*\+?=[[:space:]]*true' \
            --include='*.mk' --include='Makefile*' --include='Kbuild' . 2>/dev/null | head -20 || echo "  无"
          echo "[diag] --- .config 里值含 true 的项（前 20 条） ---"
          grep -nE 'true' out/.config 2>/dev/null | grep -vE '^[^:]*:[0-9]*:#' | head -20 || echo "  无"
          # 用 V=1 只编失败目标，把真实 clang 命令行打出来
          echo "[diag] ===== V=1 复现 kernel/bounds.s 的完整命令行 ====="
          make $MAKE_ARGS V=1 kernel/bounds.s 2>&1 | grep -nE 'true' | head -10 || echo "  未捕获到 true"
          # ===================================================================

          # ========== 5. 正式编译 ==========
          echo "[build] make -j$(nproc) $KERNEL_FILE"
          make $MAKE_ARGS -j$(nproc) $KERNEL_FILE
          echo "[done] 产物："
          ls -l out/arch/arm64/boot/ || true

      - name: Check a kernel output files
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "[check] out/arch/arm64/boot 目录内容："
          ls -lh out/arch/arm64/boot/ || { echo "[error] 输出目录不存在，编译未产出"; exit 1; }
          for f in Image; do
            if [ -f "out/arch/arm64/boot/$f" ]; then
              echo "[ok] $f 大小: $(stat -c%s out/arch/arm64/boot/$f) bytes"
            else
              echo "[error] 缺少 $f，终止"; exit 1
            fi
          done
          echo "[check] dtb/dtbo 产出（若有）："
          ls -lh out/arch/arm64/boot/dts/qcom/*.dtb 2>/dev/null | tail -5 || echo "  无独立 dtb（已并入 Image）"
          echo "[check] 内核 vermagic（必须与原厂 4.19.157-perf+ 一致，否则 vendor 模块加载失败）："
          strings -a out/arch/arm64/boot/Image | grep -m1 "SMP preempt mod_unload" || echo "  [warn] 未读到 vermagic"

      # AK3 仓库里的 tools/magiskboot 是给手机用的 ARM 二进制，在 GitHub Actions 的
      # x86_64 runner 上会直接 Exec format error，必须换成 Magisk APK 里的 x86_64 版本
      - name: Download magiskboot (x86_64)
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ -x magiskboot ]; then
            echo "[skip] magiskboot 已就绪"
            ./magiskboot 2>&1 | head -3 || true
            exit 0
          fi
          curl -sL --fail -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v31.1/app-debug.apk
          unzip -o -j magisk.apk lib/x86_64/libmagiskboot.so -d mb >/dev/null
          mv mb/libmagiskboot.so magiskboot
          chmod +x magiskboot
          file magiskboot || true
          ./magiskboot 2>&1 | head -3 || true

      # ========== 路线1：原厂 boot.img + 只替换 kernel（magiskboot 重打包） ==========
      # 完全保留原厂 boot 的结构（header / ramdisk / dtb / avb footer），仅替换内核，
      # 最稳，出问题也只动 boot，recovery + fastboot 都还在。
      # 需要把原厂 boot.img 放到仓库根目录（文件名 boot.img）才启用，没有就自动跳过。
      - name: Repack boot image (stock boot.img + new kernel)
        run: |
          set -e
          WS=$GITHUB_WORKSPACE/kernel_workspace
          cd $WS
          if [ ! -x magiskboot ]; then
            echo "[error] magiskboot 不存在（上一步下载失败）"; exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/boot.img" ]; then
            echo "[skip] 仓库根目录没有原厂 boot.img，跳过 boot 镜像打包"
            echo "[skip] 把全量包 payload.bin 里解出的 boot.img 放到仓库根目录（文件名必须是 boot.img）即可启用"
            exit 0
          fi
          rm -rf bootwork && mkdir -p bootwork/stock bootwork/verify

          cp "$GITHUB_WORKSPACE/boot.img" bootwork/stock/boot.img
          cd bootwork/stock
          echo "[stock] 原厂 boot 解包："
          $WS/magiskboot unpack boot.img
          ls -lh
          ORIG_K=$(stat -c%s kernel 2>/dev/null || echo 0)
          echo "[stock] 原厂 kernel 大小: $ORIG_K bytes"
          # 从原厂内核里抽出它自带的 .config（IKCONFIG），打印关键项，便于和新编配置对照
          if [ -f $WS/android-kernel/scripts/extract-ikconfig ]; then
            bash $WS/android-kernel/scripts/extract-ikconfig kernel > $WS/stock.config 2>/dev/null || true
            echo "[stock] 原厂关键配置："
            grep -E '^CONFIG_(LOCALVERSION=|MODULE_SIG=|MODULE_SIG_FORCE=|MODULES=|DM_VERITY=|SECURITY_SELINUX=)' $WS/stock.config || echo "  [warn] 未取到配置"
            echo "[stock] 新编配置对照："
            grep -E '^CONFIG_(LOCALVERSION=|MODULE_SIG=|MODULE_SIG_FORCE=)' $WS/android-kernel/out/.config || true
            # 原厂有、新编缺失的关键驱动配置（缺这些必然起不来：无法解密 /data、无触摸屏）
            for k in DM_CRYPT TOUCHPANEL_OPLUS OPLUS_FINGERPRINT OPLUS_SYSTEM_KERNEL_QCOM; do
              if grep -q "^CONFIG_$k=y" $WS/stock.config; then
                if grep -q "^CONFIG_$k=y" $WS/android-kernel/out/.config; then
                  echo "[cmp] $k: 一致"
                else
                  echo "[cmp][warn] $k: 原厂为 y，新编缺失（源码树/defconfig 不对应）"
                fi
              fi
            done
          fi

          cp $WS/android-kernel/out/arch/arm64/boot/Image kernel
          NEW_K=$(stat -c%s kernel)
          echo "[new] 新 kernel 大小: $NEW_K bytes"
          if [ "$ORIG_K" -gt 0 ] && [ "$NEW_K" -gt $((ORIG_K + 8388608)) ]; then
            echo "[warn] 新 kernel 比原厂大 8MB 以上，boot 分区可能装不下，刷入后会无法引导"
          fi

          echo "[repack] 用原厂 header/ramdisk 重新打包 ..."
          $WS/magiskboot repack boot.img $WS/boot-9R-new.img
          ls -lh $WS/boot-9R-new.img

          cd $WS/bootwork/verify
          cp $WS/boot-9R-new.img .
          echo "[verify] 回解新镜像，确认结构完整："
          $WS/magiskboot unpack boot-9R-new.img >/dev/null
          ls -lh
          echo "[verify] 新镜像内 kernel 大小: $(stat -c%s kernel) bytes"
          echo "[done] 产物: $WS/boot-9R-new.img"

      # ========== 备用路线：AnyKernel3 zip（参数全部按 9R 单分区 + OOS/ColorOS14 定死） ==========
      # 关键：不再用 auto 猜 ramdisk 压缩 —— 直接从原厂 boot.img 读出 RAMDISK_FMT 写进去；
      # PATCH_VBMETA_FLAG=0 彻底禁止 AK3 改 vbmeta（这是上次全黑的最大嫌疑）。
      - name: Make Anykernel3 zip
        run: |
          set -e
          WS=$GITHUB_WORKSPACE/kernel_workspace
          cd $WS
          if [ ! -x magiskboot ]; then
            echo "[error] magiskboot 不存在"; exit 1
          fi
          rm -rf ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp android-kernel/out/arch/arm64/boot/Image ak3/Image

          # 从原厂 boot.img 读真实 ramdisk 压缩格式；没有原厂镜像时用 auto
          # （auto 也是 magiskboot 嗅探，不是硬猜；只有明确读到格式才写死）
          RCOMP=auto
          if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then
            rm -rf /tmp/det && mkdir -p /tmp/det && cp "$GITHUB_WORKSPACE/boot.img" /tmp/det/
            ( cd /tmp/det && $WS/magiskboot unpack boot.img 2>&1 ) > /tmp/det/unpack.log || true
            FMT=$(sed -n 's/.*RAMDISK_FMT[[:space:]]*\[\([^]]*\)\].*/\1/p' /tmp/det/unpack.log | head -1)
            [ -n "$FMT" ] && RCOMP="$FMT"
            echo "[ak3] 原厂 boot header/ramdisk 信息："
            grep -E 'HEADER_VER|KERNEL_FMT|RAMDISK_FMT' /tmp/det/unpack.log || true
          else
            echo "[ak3] 没有原厂 boot.img，无法读取真实格式，改用 auto（magiskboot 自行嗅探）"
          fi
          echo "[ak3] 采用 ramdisk 压缩: $RCOMP"

          cd ak3
          sed -i 's|^kernel.string=.*|kernel.string=OnePlus 9R (lemonades) ColorOS14 KernelSU-Next|' anykernel.sh
          sed -i 's|^device.name1=.*|device.name1=lemonades|' anykernel.sh
          # 模板自带的 device.name2=toro 等会留下重复键，直接用替换而不是插入
          sed -i 's|^device.name2=.*|device.name2=OnePlus9R|' anykernel.sh
          sed -i 's|^device.name3=.*|device.name3=|' anykernel.sh
          sed -i 's|^device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|^device.name5=.*|device.name5=|' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's|^do.devicecheck=.*|do.devicecheck=0;|' anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|' anykernel.sh
          sed -i "s|^RAMDISK_COMPRESSION=.*|RAMDISK_COMPRESSION=$RCOMP;|" anykernel.sh
          if grep -q '^PATCH_VBMETA_FLAG=' anykernel.sh; then
            sed -i 's|^PATCH_VBMETA_FLAG=.*|PATCH_VBMETA_FLAG=0;|' anykernel.sh
          else
            # 老版本 AK3 没有这个键，插在加载核心脚本那一行之前（放文件末尾不会生效）
            sed -i '/^\. tools\/ak3-core\.sh/i PATCH_VBMETA_FLAG=0;' anykernel.sh
          fi
          echo "[ak3] 最终关键参数："
          grep -E '^BLOCK=|^block=|^IS_SLOT_DEVICE=|^RAMDISK_COMPRESSION=|^PATCH_VBMETA_FLAG=|^do.devicecheck=|^device.name' anykernel.sh

          ZIP=$WS/AnyKernel3_lemonades_${{ env.BUILD_TIME }}.zip
          zip -r9 "$ZIP" . -x ".git/*" -x "*~" -x "*.zip"
          ls -lh "$ZIP"
          echo "[ak3] 产物: $ZIP"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: |
            kernel_workspace/AnyKernel3_lemonades_*.zip
            kernel_workspace/boot-9R-new.img
            kernel_workspace/android-kernel/out/.config
            kernel_workspace/stock.config
            kernel_workspace/android-kernel/out/arch/arm64/boot/Image
          if-no-files-found: warn
